# BlueMolecule desktop app (Tauri 2): build on Linux, Windows and macOS, start each build once with a self-test, and
# keep the installers as run artifacts. A last job copies the small reports (build log, self-test results, a
# picture of the 3D view on each system, the package contents) to the ci-reports branch, where they can be read
# without access to the Actions pages.
name: Desktop builds

on:
  push:
    branches: ['main', 'claude/**']
    paths: ['src/**', 'desktop/**', 'tools/build.py', 'tools/make_big_fixture.py', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['src/**', 'desktop/**', 'tools/build.py', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-22.04 }
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: System libraries (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 xdg-utils

      - name: The page
        run: |
          mkdir -p report
          python tools/build.py --target linux > report/page.txt
          mkdir -p desktop/www
          cp dist/BlueMolecule.html desktop/www/index.html
          ls -la desktop/www >> report/page.txt

      - name: Build
        working-directory: desktop
        run: |
          set -o pipefail
          npx --yes @tauri-apps/cli@2 build --ci 2>&1 | tee ../report/build.log

      - name: Self-test
        if: always()
        timeout-minutes: 25
        run: |
          set +e
          mkdir -p selftest
          python tools/make_big_fixture.py gaussian selftest/big-opt.log --mb 900 > /dev/null
          cp tests/fixtures/cisplatin.xyz selftest/
          case "${{ matrix.name }}" in
            linux)   exe=desktop/src-tauri/target/release/bluemolecule
                     run=(dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24") ;;
            windows) exe=desktop/src-tauri/target/release/bluemolecule.exe; run=() ;;
            macos)   exe=desktop/src-tauri/target/release/bluemolecule; run=() ;;
          esac
          if [ ! -f "$exe" ]; then echo "no executable" > report/selftest-exit.txt; exit 1; fi
          here="$PWD"
          if [ "${{ matrix.name }}" = windows ]; then here=$(cygpath -m "$PWD"); fi   # C:/… for a Windows program
          # memory of the program and its web engine every 2 s while the self-test runs: "time total MB | process MB
          # (count) | …". Above the limit the program is stopped, so that a runner with little memory (macOS: 7 GB)
          # still finishes the job and writes its report.
          limit=$([ "${{ matrix.name }}" = macos ] && echo 4500 || echo 9000)
          sample() {
            if [ "${{ matrix.name }}" = windows ]; then
              powershell -NoProfile -Command "\$p = Get-Process bluemolecule,msedgewebview2 -ErrorAction SilentlyContinue; \$t = (\$p | Measure-Object WorkingSet64 -Sum).Sum / 1MB; \$g = \$p | Group-Object ProcessName | ForEach-Object { '{0} {1:F0} ({2})' -f \$_.Name, ((\$_.Group | Measure-Object WorkingSet64 -Sum).Sum / 1MB), \$_.Count }; '{0} {1:F0} MB | {2}' -f (Get-Date -Format HH:mm:ss), \$t, (\$g -join ' | ')"
            else
              ps -axo rss=,comm= | awk -v t="$(date +%T)" '{ r = $1; sub(/^ *[0-9]+ +/, ""); n = split($0, p, "/"); k = p[n]; if (tolower(k) ~ /bluemolecule|webkit|webcontent/) { s[k] += r; c[k]++; tot += r } } END { printf "%s %d MB", t, tot / 1024; for (k in s) printf " | %s %d (%d)", k, s[k] / 1024, c[k]; printf "\n" }'
            fi
          }
          ( while true; do
              line=$(sample 2>&1); echo "$line" >> report/memory.txt
              mb=$(echo "$line" | awk '{ print int($2) }')
              if [ "${mb:-0}" -gt "$limit" ]; then
                echo "above $limit MB: the program is stopped" >> report/memory.txt
                if [ "${{ matrix.name }}" = windows ]; then taskkill //IM bluemolecule.exe //F > /dev/null 2>&1; else pkill -x bluemolecule; fi
              fi
              sleep 2
            done ) &
          monitor=$!
          start=$(date +%s)
          "${run[@]}" "$exe" "--self-test=$here/report/selftest.json" "$here/selftest/cisplatin.xyz" "$here/selftest/big-opt.log" > report/selftest-output.txt 2>&1
          code=$?
          kill $monitor 2>/dev/null
          peak=$(awk '$3 == "MB" { print int($2) }' report/memory.txt 2>/dev/null | sort -n | tail -1)
          echo "exit=$code seconds=$(( $(date +%s) - start )) peak=${peak:-?}MB" > report/selftest-exit.txt
          cat report/selftest-exit.txt
          cat report/selftest.json 2>/dev/null | head -c 6000
          exit $code

      - name: Package contents
        if: always()
        run: |
          b=desktop/src-tauri/target/release/bundle
          { echo "## files"; find "$b" -maxdepth 3 -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.sig' -o -name '*.tar.gz' \) -exec ls -la {} \; 2>/dev/null; } > report/bundles.txt
          if [ "${{ matrix.name }}" = linux ]; then
            for d in "$b"/deb/*.deb; do
              [ -f "$d" ] || continue
              { echo "## $d"; dpkg-deb -I "$d"; dpkg-deb -c "$d"; } >> report/bundles.txt
              mkdir -p debx && dpkg-deb -x "$d" debx && find debx -name '*.desktop' -exec sh -c 'echo "## $1"; cat "$1"' _ {} \; >> report/bundles.txt
            done
          fi
          if [ "${{ matrix.name }}" = macos ]; then
            for p in "$b"/macos/*.app/Contents/Info.plist; do [ -f "$p" ] && { echo "## $p"; cat "$p"; } >> report/bundles.txt; done
          fi
          ls -la desktop/src-tauri/target/release/ >> report/bundles.txt 2>/dev/null || true
          cp desktop/src-tauri/Cargo.lock report/ 2>/dev/null || true

      - name: Installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlueMolecule-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.name }}
          path: report/

  reports:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports

      - name: Publish the reports on the ci-reports branch
        env:
          TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RESULT: ${{ needs.build.result }}
        run: |
          set -e
          git init -q pub && cd pub
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-reports; then git checkout -q -B ci-reports FETCH_HEAD; else git checkout -q --orphan ci-reports; fi
          dest="runs/$RUN"
          mkdir -p "$dest"
          cp -r ../reports/. "$dest"/
          # keep the build log readable: its last 400 lines
          for f in "$dest"/*/build.log; do [ -f "$f" ] && { tail -n 400 "$f" > "$f.tail"; mv "$f.tail" "$f"; }; done
          printf 'run %s\ncommit %s\nbranch %s\nbuild result %s\nurl %s/%s/actions/runs/%s\n' "$RUN" "$SHA" "$REF" "$RESULT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RUN" > "$dest/run.txt"
          for d in "$dest"/report-*; do [ -d "$d" ] && printf '%s: %s\n' "$(basename "$d")" "$(cat "$d/selftest-exit.txt" 2>/dev/null || echo 'no self-test')" >> "$dest/run.txt"; done
          printf '%s\n' "$RUN" > latest.txt
          printf 'Reports of the desktop builds (.github/workflows/desktop.yml); latest.txt names the newest run.\n' > README.md
          # the last 30 runs are kept
          ls -1d runs/* | sort -n -t/ -k2 | head -n -30 | xargs -r git rm -rq --
          git add -A
          git -c user.name="BlueMolecule builds" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Reports of run $RUN ($REF, $RESULT)"
          git push -q origin ci-reports
