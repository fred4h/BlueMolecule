<div id="app">
  <header id="toolbar">
    <div class="brand"><svg class="logo"><use href="#i-logo"/></svg><span>Blue<b>Molecule</b></span></div>
    <div class="tb-group">
      <button class="tb" id="btn-new" title="New molecule: an empty document for building"><svg class="ic"><use href="#i-new"/></svg><span>New</span></button>
      <button class="tb" id="btn-open" title="Open files (Ctrl/⌘+O)"><svg class="ic"><use href="#i-open"/></svg><span>Open</span></button>
      <div class="dropdown" id="dd-export">
        <button class="tb" data-dd title="Save geometry, inputs and images"><svg class="ic"><use href="#i-save"/></svg><span>Export</span><svg class="ic sm"><use href="#i-chev"/></svg></button>
        <div class="menu">
          <button data-act="save-as" title="XYZ, SDF, Mol2, CIF, POSCAR, GRO, Molden, cube… and Open Babel formats">Save as…<kbd>⇧⌘S</kbd></button>
          <button data-act="export-calc" title="Gaussian, ORCA, Psi4, Q-Chem, NWChem, GAMESS, MOPAC, xtb, Molpro, Turbomole">Calculation input…</button>
          <button data-act="export-image">Image…</button>
          <button data-act="export-vib" title="Animated XYZ of the selected vibration">Vibration animation</button>
        </div>
      </div>
    </div>
    <div class="tb-group seg" id="style-seg" title="Display style (1–4)">
      <button data-style="ballstick" class="on">Ball &amp; stick</button>
      <button data-style="sticks">Sticks</button>
      <button data-style="spacefill">Spacefill</button>
      <button data-style="wireframe">Wire</button>
    </div>
    <div class="tb-group">
      <label class="sel" title="Atom labels (L)"><span>Labels</span>
        <select id="sel-labels">
          <option value="none">None</option><option value="symbol">Symbol</option><option value="number">Number</option>
          <option value="symnum">Symbol + number</option><option value="charge">Charges</option>
        </select></label>
      <label class="sel" title="Atom colouring"><span>Colour</span>
        <select id="sel-color"><option value="element">Element</option><option value="charge">Charge</option></select></label>
    </div>
    <div class="tb-group toggles">
      <button class="tg on" id="tg-h" title="Show hydrogens (H)">H</button>
      <button class="tg" id="tg-bl" title="Show bond lengths (B)">Å</button>
      <button class="tg on" id="tg-persp" title="Perspective projection (P)">Persp</button>
      <button class="tg on" id="tg-fog" title="Depth cueing">Depth</button>
      <button class="tg on" id="tg-axes" title="Axes indicator">Axes</button>
    </div>
    <div class="tb-group">
      <label class="sel" title="Background"><span>Bg</span>
        <select id="sel-bg"><option value="navy">Navy</option><option value="black">Black</option><option value="white">White</option><option value="gray">Gray</option></select></label>
      <div class="dropdown" id="dd-view">
        <button class="tb icon" data-dd title="View"><svg class="ic"><use href="#i-reset"/></svg><svg class="ic sm"><use href="#i-chev"/></svg></button>
        <div class="menu">
          <button data-act="view-reset">Reset view (R)</button>
          <button data-act="view-x">Look along X</button>
          <button data-act="view-y">Look along Y</button>
          <button data-act="view-z">Look along Z</button>
          <button data-act="view-center-sel">Centre on selection</button>
        </div>
      </div>
      <button class="tb icon" id="btn-image" title="Save image"><svg class="ic"><use href="#i-camera"/></svg></button>
      <div class="dropdown" id="dd-settings">
        <button class="tb icon" data-dd title="Display settings"><svg class="ic"><use href="#i-gear"/></svg></button>
        <div class="menu wide settings">
          <label>Atom size <input type="range" id="set-atom" min="0.12" max="0.5" step="0.01" value="0.25"><output></output></label>
          <label>Bond radius <input type="range" id="set-bond" min="0.04" max="0.3" step="0.01" value="0.11"><output></output></label>
          <label>Spacefill scale <input type="range" id="set-vdw" min="0.5" max="1.2" step="0.05" value="1"><output></output></label>
          <label>Bond tolerance (Å) <input type="range" id="set-tol" min="0" max="0.9" step="0.05" value="0.4"><output></output></label>
          <label class="check"><input type="checkbox" id="set-dummy" checked> Show dummy / ghost atoms</label>
          <hr>
          <label class="check"><input type="checkbox" id="set-orders" checked> Bond orders (double, triple, aromatic)</label>
          <label class="check"><input type="checkbox" id="set-hbonds"> Hydrogen bonds</label>
          <label class="check"><input type="checkbox" id="set-dipole"> Dipole moment arrow</label>
          <label class="check"><input type="checkbox" id="set-cell" checked> Unit cell</label>
        </div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="tb icon" id="btn-theme" title="Light / dark interface"><svg class="ic"><use href="#i-theme"/></svg></button>
    <button class="tb icon" id="btn-help" title="Help and shortcuts (?)"><svg class="ic"><use href="#i-help"/></svg></button>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div id="doc-list"></div>
      <nav id="tabs"></nav>
      <div id="panel"></div>
    </aside>
    <div class="resizer v" id="rz-side"></div>
    <section id="center">
      <div id="viewport">
        <canvas id="gl"></canvas>
        <canvas id="overlay"></canvas>
        <div id="toolbox" class="hidden" role="toolbar" aria-label="Build tools"></div>
        <div id="hud"><div id="toolopts" class="toolopts hidden"></div><div id="measure" class="chip hidden"></div></div>
        <div id="playbar" class="hidden"></div>
        <div id="pending" class="hidden"><div class="pending-card"><b>Coordinates pending</b><span id="pending-msg"></span><button class="btn small primary" id="btn-open-3"><svg class="ic sm"><use href="#i-open"/></svg>Open coordinates…</button></div></div>
        <div id="empty">
          <div class="empty-card">
            <svg class="logo big"><use href="#i-logo"/></svg>
            <h1>BlueMolecule</h1>
            <p>Open a calculation to view structures, optimisation steps, vibrations, spectra and orbitals — or build a molecule.</p>
            <div class="empty-actions">
              <button class="primary" id="btn-open-2"><svg class="ic"><use href="#i-open"/></svg>Open files…</button>
              <button class="secondary" id="btn-new-2"><svg class="ic"><use href="#i-t-draw"/></svg>New molecule</button>
            </div>
            <p class="hint">or drop files anywhere in this window</p>
            <div class="smiles-start"><input type="text" id="empty-smiles" placeholder="Build from SMILES, e.g. CC(=O)Oc1ccccc1C(=O)O" spellcheck="false" aria-label="Build from SMILES"><button id="btn-smiles-2">Build</button></div>
            <div class="formats" id="formats"></div>
            <div class="examples" id="examples"></div>
          </div>
        </div>
      </div>
      <div class="resizer h" id="rz-plot"></div>
      <div id="plotpanel">
        <div class="plot-head">
          <label class="plot-pick" id="plot-pick-wrap"><svg class="ic sm"><use href="#i-plot"/></svg><select id="plot-pick" aria-label="Plot"></select><span class="count mono" id="plot-count"></span></label>
          <div class="plot-controls" id="plot-controls"></div>
          <div class="plot-actions">
            <button class="mini" data-act="plot-csv" title="Save curve and sticks as CSV">CSV</button>
            <button class="mini" data-act="plot-png" title="Save plot as PNG">PNG</button>
            <button class="mini" data-act="plot-svg" title="Save plot as SVG">SVG</button>
            <button class="mini icon" id="btn-plot-collapse" title="Collapse / expand"><svg class="ic sm"><use href="#i-collapse"/></svg></button>
          </div>
        </div>
        <div class="plot-body"><canvas id="plot"></canvas></div>
      </div>
    </section>
  </div>

  <footer id="status"><span id="status-msg">Ready</span><span id="status-hover"></span><span id="status-info"></span></footer>
